# Sync Upstream Repos Workflow
#
# Keeps git submodules updated with upstream repositories.
# Generates changelog and creates tracking issues.
#
# No secrets required (uses GITHUB_TOKEN).

name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update submodules
        run: |
          git submodule update --remote --merge

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          CHANGELOG_DIR=.github/upstream-changelog
          CHANGELOG_FILE="$GITHUB_WORKSPACE/$CHANGELOG_DIR/${DATE}.md"

          mkdir -p "$CHANGELOG_DIR"

          {
            echo "# Upstream Changes - ${DATE}"
            echo ""
            echo "## Updated Repositories"
            echo ""
          } > "$CHANGELOG_FILE"

          # Check each submodule directory
          # shellcheck disable=SC2016  # $sm_path is expanded by git submodule foreach
          git submodule foreach --quiet 'echo "$sm_path"' | while read -r repo; do
            [ -d "$repo" ] || continue

            # Get recent commits
            COMMITS=$(git -C "$repo" log --oneline --since="7 days ago" 2>/dev/null | head -10)

            if [ -n "$COMMITS" ]; then
              {
                echo "### $(basename "$repo")"
                echo '```'
                echo "$COMMITS"
                echo '```'
                echo ""
              } >> "$CHANGELOG_FILE"
            fi
          done

          {
            echo "---"
            echo "*Auto-generated by GitHub Actions*"
          } >> "$CHANGELOG_FILE"

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "chore: sync upstream $(date +%Y-%m-%d)"
          git push

      - name: Create tracking issue
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream Update - ${date}`,
              body: `## Upstream repositories updated

            Check changelog at \`.github/upstream-changelog/${date}.md\`

            ### Action Items
            - [ ] Review changes
            - [ ] Update if breaking changes
            - [ ] Test compatibility
            - [ ] Update documentation`,
              labels: ['upstream-update', 'needs-review']
            });
