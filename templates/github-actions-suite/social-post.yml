# Social Media Post Workflow
#
# Posts content to X (Twitter).
# Uses Claude API to generate platform-optimized posts.
#
# Required Secrets:
# - ANTHROPIC_API_KEY: Claude API key
#
# X/Twitter Secrets:
# - X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET

name: Post to Social Media

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Content to post (or article slug)'
        required: true
        type: string
      platforms:
        description: 'Platforms (comma-separated: x)'
        required: true
        type: string
        default: 'x'
      language:
        description: 'Language'
        required: true
        type: choice
        options:
          - en
          - zh-tw
          - ja
        default: en
      dry_run:
        description: 'Dry run (no actual posting)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Short social copy is a fast, inexpensive task, so Haiku fits.
  CLAUDE_MODEL: claude-haiku-5-5

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    outputs:
      posts_json: ${{ steps.generate.outputs.posts_json }}

    steps:
      - name: Generate platform-specific posts
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT: ${{ inputs.content }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          cat > /tmp/generate.js << 'EOF'
          const https = require('https');

          async function callClaude(prompt) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                model: process.env.CLAUDE_MODEL || 'claude-haiku-5-5',
                max_tokens: 4096,
                output_config: { effort: 'low' },
                messages: [{ role: 'user', content: prompt }]
              });

              const req = https.request({
                hostname: 'api.anthropic.com',
                path: '/v1/messages',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.ANTHROPIC_API_KEY,
                  'anthropic-version': '2023-06-01'
                }
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const response = JSON.parse(data);
                    if (response.error) return reject(new Error(response.error.message));
                    // Current models can return a thinking block first; read the text block
                    const text = response.content.find(block => block.type === 'text');
                    resolve(text ? text.text : '');
                  } catch (e) { reject(e); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const content = process.env.CONTENT;
            const lang = process.env.LANGUAGE;

            const langInstructions = {
              en: 'Write in English.',
              'zh-tw': '使用繁體中文撰寫。',
              ja: '日本語で書いてください。'
            };

            const prompt = `
              Generate a social media post for this content:
              "${content}"

              ${langInstructions[lang]}

              Return JSON only:
              {
                "x": "Tweet under 280 chars. Include relevant hashtags."
              }
            `;

            const result = await callClaude(prompt);
            const posts = JSON.parse(result.match(/\{[\s\S]*\}/)[0]);
            console.log(JSON.stringify(posts));
          }

          main().catch(err => {
            console.error('Error:', err.message);
            process.exit(1);
          });
          EOF

          node /tmp/generate.js > /tmp/posts.json
          echo "Generated posts:"
          cat /tmp/posts.json

          echo "posts_json=$(base64 -w 0 /tmp/posts.json)" >> "$GITHUB_OUTPUT"

  post-to-x:
    needs: generate-posts
    runs-on: ubuntu-latest
    if: contains(inputs.platforms, 'x')

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          POSTS_B64: ${{ needs.generate-posts.outputs.posts_json }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$X_API_KEY" ]; then
            echo "X API not configured, skipping"
            exit 0
          fi

          TWEET=$(base64 -d <<<"$POSTS_B64" | jq -r '.x')

          echo "Tweet: $TWEET"

          if [ "$DRY_RUN" == "true" ]; then
            echo "DRY RUN - Would post: $TWEET"
            exit 0
          fi

          # Install OAuth library (HMAC-SHA1 comes from Node's built-in crypto)
          cd /tmp && npm init -y > /dev/null && npm install oauth-1.0a@2

          cat > /tmp/post-x.js << 'EOF'
          const OAuth = require('oauth-1.0a');
          const crypto = require('node:crypto');
          const https = require('https');

          const oauth = OAuth({
            consumer: { key: process.env.X_API_KEY, secret: process.env.X_API_SECRET },
            signature_method: 'HMAC-SHA1',
            hash_function(base_string, key) {
              return crypto.createHmac('sha1', key).update(base_string).digest('base64');
            }
          });

          const token = { key: process.env.X_ACCESS_TOKEN, secret: process.env.X_ACCESS_SECRET };
          const tweet = process.env.TWEET;

          const url = 'https://api.twitter.com/2/tweets';
          const request_data = { url, method: 'POST' };
          const headers = oauth.toHeader(oauth.authorize(request_data, token));
          headers['Content-Type'] = 'application/json';

          const req = https.request(url, { method: 'POST', headers }, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              console.log('Response:', data);
              if (res.statusCode >= 200 && res.statusCode < 300) {
                console.log('Posted to X successfully');
              } else {
                console.error('Failed to post');
                process.exit(1);
              }
            });
          });

          req.write(JSON.stringify({ text: tweet }));
          req.end();
          EOF

          TWEET="$TWEET" node /tmp/post-x.js
