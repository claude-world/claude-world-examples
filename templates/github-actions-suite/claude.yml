# Claude Code (@claude mentions)
#
# Mention @claude in an issue, pull request, review, or review comment and
# Claude Code answers questions, reviews code, or implements the change on a
# new branch. Only users with write access can trigger it.
#
# Setup (pick one):
# - Run /install-github-app in Claude Code: it installs the Claude GitHub App,
#   adds the secret, and opens a PR with this workflow.
# - Or install https://github.com/apps/claude and add ANTHROPIC_API_KEY as a
#   repository secret (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`
#   to use a Claude subscription).
#
# Docs: https://code.claude.com/docs/en/github-actions

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write  # GitHub App authentication
      actions: read    # lets Claude read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or use a Claude subscription instead of an API key:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Claude Code CLI flags. Without --model, the action uses the
          # Claude Code default model.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30

          # Optional: a different trigger phrase (default: @claude)
          # trigger_phrase: "/claude"
