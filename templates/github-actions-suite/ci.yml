# CI/CD Workflow
#
# Runs on push and pull requests to main branch.
# Includes build, lint, test, and validation jobs.
#
# Customize based on your project structure. The npm steps use --if-present,
# so a missing script is skipped while a failing one fails the job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # Job 1: Validate Configuration
  # ========================================
  validate-config:
    runs-on: ubuntu-latest
    name: Validate Config

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install validators
        run: python -m pip install pyyaml

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          errors=0

          while IFS= read -r -d '' file; do
            if python -c 'import json, sys; json.load(open(sys.argv[1]))' "$file"; then
              echo "  $file"
            else
              echo "  $file - INVALID"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*' -print0)

          if [ "$errors" -gt 0 ]; then
            echo "Found $errors invalid JSON files"
            exit 1
          fi

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."

          while IFS= read -r -d '' file; do
            if python -c 'import sys, yaml; list(yaml.safe_load_all(open(sys.argv[1])))' "$file"; then
              echo "  $file"
            else
              echo "  $file - INVALID"
              exit 1
            fi
          done < <(find . \( -name '*.yml' -o -name '*.yaml' \) -not -path './node_modules/*' -not -path './.git/*' -print0)

  # ========================================
  # Job 2: Build
  # ========================================
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - uses: actions/checkout@v7

      # Uncomment for pnpm (and set `cache: pnpm` below)
      # - name: Setup pnpm
      #   uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present
        env:
          # Add any required build-time env vars
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
          retention-days: 7

  # ========================================
  # Job 3: Lint
  # ========================================
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Prettier check
        run: npm run format:check --if-present

  # ========================================
  # Job 4: Test
  # ========================================
  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ========================================
  # Job 5: Security Audit
  # ========================================
  security:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ========================================
  # Job 6: Deploy (only on main)
  # ========================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: [build, lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist/

      - name: Deploy
        run: |
          echo "Deploying..."
          # Add your deployment commands here
          # Examples:
          # - npx wrangler pages deploy ./dist (Cloudflare)
          # - npx vercel --prod (Vercel)
          # - npx netlify deploy --prod (Netlify)
          echo "Deployment placeholder - customize for your platform"
