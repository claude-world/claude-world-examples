# Claude Code Review (automated PR review)
#
# Reviews every pull request with the official code-review plugin and posts
# inline comments for the issues it finds (or one summary comment).
# Claude skips drafts, closed PRs, and PRs it already reviewed.
#
# Setup: same as claude.yml (Claude GitHub App + ANTHROPIC_API_KEY or
# CLAUDE_CODE_OAUTH_TOKEN). GitHub withholds secrets from fork PRs in public
# repositories, so reviews run for branches in this repository only.
#
# Docs: https://code.claude.com/docs/en/github-actions#run-a-skill

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write  # the GitHub App token posts the review comments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action starts the inline-comment tool only when --allowedTools names it
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
